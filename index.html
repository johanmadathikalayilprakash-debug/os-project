/* ---------- Module B: page replacement ---------- */
function pgSim(refs,f,al){const fr=[],q=[],last={},steps=[];let flt=0;
 refs.forEach((p,i)=>{let hit=fr.includes(p),ev=null,why='already resident, no change';
  if(!hit){flt++;if(fr.length<f){fr.push(p);q.push(p);why='a free frame was available'}else{let v;
   if(al==='FIFO'){v=q[0];why=`page ${v} has been resident longest`}
   else if(al==='LRU'){v=fr.reduce((a,b)=>last[a]<=last[b]?a:b);why=`page ${v} was least recently used (last at reference ${last[v]+1})`}
   else{let b=-1;fr.forEach(x=>{let n=refs.indexOf(x,i+1);if(n<0)n=Infinity;if(n>b){b=n;v=x}});why=b===Infinity?`page ${v} is never used again`:`page ${v} is used farthest in the future (reference ${b+1})`}
   fr[fr.indexOf(v)]=p;q.splice(q.indexOf(v),1);q.push(p);ev=v}}
  last[p]=i;
  steps.push({p,hit,ev,why,fr:[...fr],cf:flt,msg:`Reference ${i+1}: page ${p} is a ${hit?'HIT':'FAULT'}${ev!==null?`, evict page ${ev} (${why})`:` (${why})`}`})});
 return{steps,f,al,refs,hits:refs.length-flt,flt}}
function pgIn(){const E=[],t=toks($('#pg-r').value),f=$('#pg-f').value.trim();
 if(!t.length)E.push('Reference string: enter at least one page number.');else if(t.length>200)E.push('Reference string: the limit is 200 references.');
 else t.forEach((v,n)=>{if(!/^\d{1,6}$/.test(v))E.push(`Reference ${n+1}: “${v}” must be a non-negative integer of up to 6 digits (check the separators).`)});
 if(!/^\d+$/.test(f)||f<1||f>20)E.push('Frames: enter an integer from 1 to 20.');
 return E.length?{errs:E}:{refs:t.map(Number),f:+f}}
mods.pg={ex(){$('#pg-r').value='7, 0, 1, 2, 0, 3, 0, 4';$('#pg-f').value=3},

 cmp(){const v=pgIn();if(v.errs)return v;const n=v.refs.length;
  return{html:`<div class=card><h3>Comparison on the same reference string and ${v.f} frame(s)</h3>${tbl(['Algorithm','Faults','Hits','Fault ratio','Hit ratio'],['FIFO','LRU','OPT'].map(a=>{const r=pgSim(v.refs,v.f,a);return[a==='OPT'?'Optimal':a,r.flt,r.hits,fx(r.flt/n*100)+'%',fx(r.hits/n*100)+'%']}))}<p>Ratios = count ÷ ${n} references × 100%. Optimal needs future knowledge, so it is a benchmark rather than a practical policy.</p></div>`}},
 view(r,i){if(i<0)return'<p>Initial state: all frames are empty.</p>';const s=r.steps.slice(0,i+1),h=s.filter(x=>x.hit).length;
  return pgStory(r,i)+`<h3>Frame trace: ${r.al==='OPT'?'Optimal':r.al}, ${r.f} frame(s)</h3>`+tbl(['Reference',...s.map(x=>x.p)],[...Array(r.f).keys()].map(k=>[`Frame ${k+1}`,...s.map(x=>x.fr[k]??'–')]).concat([['Result',...s.map(x=>`<span class=${x.hit?'hit':'flt'}>${x.hit?'✓ HIT':'✗ FAULT'}</span>`)],['Evicted',...s.map(x=>x.ev??'–')],['Cumulative faults',...s.map(x=>x.cf)]]))+
  `<p>After ${s.length} of ${r.refs.length} references: <b>${h} hits</b>, <b>${s.length-h} faults</b>, hit ratio ${fx(h/s.length*100)}%, fault ratio ${fx((s.length-h)/s.length*100)}%.</p>`+lg(r.steps,i)}};

/* ---------- Module C: disk scheduling ---------- */
function diskRun(al,v){const{min,max,head,dir,rq}=v,P=[{pos:head,kind:'start',why:'initial head position',d:0,cum:0}];let pos=head,cum=0;
 const mv=(to,kind,why)=>{const d=Math.abs(to-pos);cum+=d;P.push({pos:to,kind,why,d,cum});pos=to},Q=rq.map((c,i)=>({c,i}));
 if(al==='FCFS')Q.forEach(x=>mv(x.c,'service',`request ${x.i+1} in arrival order`));
 else if(al==='SSTF'){let pd=[...Q];while(pd.length){const b=pd.reduce((a,x)=>{const da=Math.abs(a.c-pos),dx=Math.abs(x.c-pos);return dx<da||(dx===da&&(x.c<a.c||(x.c===a.c&&x.i<a.i)))?x:a});mv(b.c,'service',`nearest pending request (distance ${Math.abs(b.c-pos)})`);pd=pd.filter(x=>x!==b)}}
 else{const rt=dir==='Right',asc=(a,b)=>a.c-b.c||a.i-b.i,dsc=(a,b)=>b.c-a.c||a.i-b.i,
  f1=Q.filter(x=>rt?x.c>=head:x.c<=head).sort(rt?asc:dsc),f2=Q.filter(x=>rt?x.c<head:x.c>head).sort(rt?dsc:asc),e1=rt?max:min,e2=rt?min:max,sv=(L,w)=>L.forEach(x=>mv(x.c,'service',w));
  sv(f1,'on the sweep path');
  if((al==='SCAN'||al==='CSCAN')&&pos!==e1)mv(e1,'boundary','continue to the physical disk boundary');
  if(al==='SCAN'||al==='LOOK')sv(f2,al==='SCAN'?'on the return sweep':'reversed at the last pending request');
  else{const s2=[...f2].reverse();if(s2.length){mv(al==='CSCAN'?e2:s2[0].c,'wrap',al==='CSCAN'?'wrap to the opposite boundary (distance counted)':'jump to the furthest pending request at the opposite end (distance counted)');sv(s2,'after the wrap, same direction')}}}
 return{path:P,min,max,al,n:rq.length,total:cum,order:P.filter(p=>p.kind==='service').map(p=>p.pos),steps:P.slice(1).map(p=>({msg:`${{service:'Serve',boundary:'Move to boundary',wrap:'Wrap to'}[p.kind]} cylinder ${p.pos} (moved ${p.d}, total ${p.cum}): ${p.why}`}))}}
function diskIn(needDir){const E=[],g=id=>$('#'+id).value.trim(),mn=g('dk-min'),mx=g('dk-max'),hd=g('dk-h'),dir=g('dk-d'),rg=isI(mn)&&isI(mx);
 if(!isI(mn))E.push('Disk range: minimum cylinder must be an integer.');if(!isI(mx))E.push('Disk range: maximum cylinder must be an integer.');
 if(rg&&+mn>=+mx)E.push('Disk range: minimum must be less than maximum.');
 if(!isI(hd))E.push('Head position must be an integer.');else if(rg&&(+hd<+mn||+hd>+mx))E.push(`Head position ${hd} is outside the disk range ${mn}–${mx}.`);
 const t=toks(g('dk-r'));if(!t.length)E.push('Request queue: enter at least one cylinder.');else if(t.length>100)E.push('Request queue: the limit is 100 requests.');
 else t.forEach((v,n)=>{if(!isI(v))E.push(`Request ${n+1}: “${v}” is not an integer (check the separators).`);else if(rg&&(+v<+mn||+v>+mx))E.push(`Request ${n+1}: ${v} is outside the disk range ${mn}–${mx}.`)});
 if(needDir&&!dir)E.push('Direction is required for SCAN, C-SCAN, LOOK and C-LOOK.');
 return E.length?{errs:E}:{min:+mn,max:+mx,head:+hd,dir,rq:t.map(Number)}}
mods.dk={alg(){$('#dk-d').disabled=/^(FCFS|SSTF)$/.test($('#dk-a').value)},
 ex(){[['dk-min',0],['dk-max',199],['dk-h',50],['dk-d','Right']].forEach(([a,b])=>$('#'+a).value=b);$('#dk-r').value='82, 170, 43, 140, 24, 16, 190'},
 run(){const al=$('#dk-a').value,v=diskIn(/^(SCAN|CSCAN|LOOK|CLOOK)$/.test(al));return v.errs?v:diskRun(al,v)},

  return{html:`<div class=card><h3>Comparison: same queue, head ${v.head}, range ${v.min}–${v.max}, direction ${v.dir}</h3>${tbl(['Algorithm','Total head movement','Average per request','Service order'],['FCFS','SSTF','SCAN','CSCAN','LOOK','CLOOK'].map(a=>{const r=diskRun(a,v);return[dn(a),r.total,fx(r.total/r.n),r.order.join(', ')]}))}<p>Wrap jumps and boundary runs count as head movement. Which policy wins depends on the request pattern.</p></div>`}},
 view(r,i){const pts=r.path.slice(0,i+2),W=680,H=48+22*r.path.length,X=p=>30+(p-r.min)/(r.max-r.min)*600,Y=k=>40+k*22;

  for(let k=1;k<pts.length;k++)s+=`<line x1="${X(pts[k-1].pos)}" y1="${Y(k-1)}" x2="${X(pts[k].pos)}" y2="${Y(k)}" class="${pts[k].kind==='wrap'?'wl':'pl'}"/>`;
  pts.forEach((p,k)=>{s+=`<circle cx="${X(p.pos)}" cy="${Y(k)}" r="4" class="pc"/><text x="${X(p.pos)+7}" y="${Y(k)+4}" class="sl">${p.pos}</text>`});
  const last=i===r.steps.length-1;

  (last?`<p><b>Total head movement: ${r.total}</b> cylinders; average per request ${fx(r.total/r.n)}; final head position ${r.path[r.path.length-1].pos}.<br>Service order: ${r.order.join(', ')}</p>`:'')+lg(r.steps,i)}};

/* ---------- Module D: Banker's safety algorithm ---------- */
function bank(A,X,V){const n=A.length,m=V.length,N=A.map((r,i)=>r.map((v,j)=>X[i][j]-v)),W=[...V],F=Array(n).fill(false),seq=[],steps=[];
 for(;;){const i=F.findIndex((f,k)=>!f&&N[k].every((v,j)=>v<=W[j]));if(i<0)break;
  const b=[...W];A[i].forEach((v,j)=>W[j]+=v);F[i]=true;seq.push(i);
  steps.push({i,F:[...F],W:[...W],msg:`P${i}: Need ${vec(N[i])} ≤ Work ${vec(b)}, so it can finish and release Allocation ${vec(A[i])}; Work = ${vec(W)}`})}
 const safe=seq.length===n,left=F.map((f,k)=>f?-1:k).filter(k=>k>=0);
 steps.push({end:1,safe,F:[...F],W:[...W],msg:safe?`SAFE STATE ✓ Safe sequence: <${seq.map(i=>'P'+i).join(', ')}>`:`UNSAFE STATE ✗ No safe sequence exists. Unfinished: ${left.map(k=>`P${k} (${N[k].map((v,j)=>v>W[j]?`${rn(j)} short by ${v-W[j]}`:'').filter(Boolean).join(', ')})`).join('; ')}. This is not a deadlock that has occurred; no process order guarantees completion.`});
 return{A,X,V,N,steps,n,m}}
function bkIn(){const E=[],mat=(id,nm)=>{const M=[];$('#'+id).value.split('\n').map(s=>s.trim()).filter(Boolean).forEach((l,r)=>{const c=toks(l);c.forEach((v,j)=>{if(!/^\d+$/.test(v))E.push(`${nm}, row ${r+1}, column ${j+1}: “${v}” must be a non-negative integer.`)});M.push(c.map(Number))});return M},
 A=mat('bk-a','Allocation'),X=mat('bk-x','Maximum'),V0=toks($('#bk-v').value),V=V0.map(Number),n=A.length,m=n?A[0].length:0;
 V0.forEach((v,j)=>{if(!/^\d+$/.test(v))E.push(`Available, entry ${j+1}: “${v}” must be a non-negative integer.`)});
 if(!n)E.push('Allocation: enter at least one process row.');if(n>20||m>10)E.push('Limits: at most 20 processes and 10 resource types.');
 if(A.some(r=>r.length!==m))E.push('Allocation: every row needs the same number of columns (missing cells?).');
 if(X.length!==n)E.push(`Maximum has ${X.length} row(s) but Allocation has ${n}.`);else if(X.some(r=>r.length!==m))E.push('Maximum: every row must have as many columns as Allocation.');
 if(V.length!==m)E.push(`Available has ${V.length} entries but there are ${m} resource types.`);
 if(!E.length)A.forEach((r,i)=>r.forEach((v,j)=>{if(X[i][j]<v)E.push(`P${i}, resource ${rn(j)}: Maximum ${X[i][j]} is less than Allocation ${v}.`)}));
 return E.length?{errs:E}:{A,X,V}}
mods.bk={ex(){$('#bk-a').value='0 1 0\n2 0 0\n3 0 2\n2 1 1\n0 0 2';$('#bk-x').value='7 5 3\n3 2 2\n9 0 2\n2 2 2\n4 3 3';$('#bk-v').value='3 3 2'},

 view(r,i){const s=i<0?{F:Array(r.n).fill(false),W:r.V}:r.steps[i],head=['',...[...Array(r.m).keys()].map(rn)],
  M=(t,Mx,mk)=>`<div><h3>${t}</h3>${tbl(head,Mx.map((row,k)=>[`P${k}${mk&&s.F[k]?' ✓':''}${mk&&s.i===k?' ◀ now':''}`,...row]))}</div>`;
  return bkStory(r,i,s)+`<div class=g2>${M('Allocation',r.A)}${M('Maximum',r.X)}${M('Need = Max − Alloc (✓ = finished)',r.N,1)}</div><h3>Work (available) now</h3><div class=pop>${tbl(head.slice(1),[s.W])}</div>`+(s.end?`<p class="${s.safe?'hit':'flt'}" role=status><b>${esc(s.msg)}</b></p>`:'')+lg(r.steps,i)}};

const ctl=c=>`<div class=bar><button class=pri data-a=run>Run</button><button data-a=prev disabled>◀ Prev</button><button data-a=play disabled>▶ Play</button><button data-a=next disabled>Next ▶</button><button data-a=reset disabled>Reset</button><button data-a=ex>Load example</button>${c?'<button data-a=cmp>Compare all</button>':''}<label>Speed <select data-a=spd><option value=1200>Slow<option value=700 selected>Normal<option value=250>Fast</select></label></div>`,

hm=`<section id=home><h1>Interactive OS Algorithm Lab</h1><p>Step through real implementations of core Operating Systems algorithms using your own input. Everything here is a <b>simulation</b>; it does not control your computer’s real scheduler, disk, memory or resources.</p><div class=g2>${[['cpu','CPU scheduling','FCFS, SJF, SRTF, Round Robin and Priority (both modes) with a Gantt chart and metrics.'],['pg','Page replacement','FIFO, LRU and Optimal with a frame-by-frame hit and fault trace.'],['dk','Disk scheduling','FCFS, SSTF, SCAN, C-SCAN, LOOK and C-LOOK with a head-path chart.'],['bk','Banker’s algorithm','Need matrix, safety iterations and safe sequence.']].map(c=>`<div class=card><h3>${c[1]}</h3><p>${c[2]}</p><button data-k=${c[0]}>Open ${c[1]}</button></div>`).join('')}</div><p>How to use: open a module, load the example or type your own data, press <b>Run</b>, then step with Prev and Next or press Play. <b>Compare all</b> runs every algorithm on identical input.</p></section>`,
ln=`<section id=learn hidden><h2>Learn: rules, conventions and limits</h2>
<details open><summary>CPU scheduling</summary><ul><li><b>FCFS</b>: earliest arrival runs to completion (convoy effect).</li><li><b>SJF</b>: shortest burst first, non-preemptive. <b>SRTF</b>: re-checked every time unit; only a strictly shorter remaining time preempts.</li><li><b>Round Robin</b>: FIFO queue, each turn is min(quantum, remaining). A process arriving exactly when a quantum ends joins the queue <i>before</i> the expired process.</li><li><b>Priority</b>: lower number = higher priority; only a strictly higher priority preempts; starvation is possible.</li><li>Ties: earlier arrival, then input order. Idle gaps appear as hatched “idle” blocks. TAT = CT − AT, WT = TAT − BT, RT = first CPU start − AT, utilization = busy time ÷ elapsed time (t = 0 to last completion), throughput = processes ÷ elapsed time.</li></ul></details>
<details><summary>Page replacement</summary><ul><li><b>FIFO</b> evicts the page resident longest; hits do not reorder. <b>LRU</b> evicts the page unused for longest; hits refresh recency. <b>Optimal</b> evicts the page whose next use is farthest away (never used again first; ties go to the lowest frame), so it is a benchmark, not implementable online.</li><li>Ratios = hits or faults ÷ references × 100%. FIFO can show Belady’s anomaly (more frames, more faults).</li></ul></details>
<details><summary>Disk scheduling</summary><ul><li><b>FCFS</b>: queue order. <b>SSTF</b>: nearest request (ties: lower cylinder, then input order); far requests can starve.</li><li><b>SCAN</b> sweeps to the physical boundary, then reverses. <b>C-SCAN</b> sweeps to the boundary, wraps to the opposite boundary and continues the same way. <b>LOOK</b> and <b>C-LOOK</b> turn or wrap at the last pending request instead.</li><li>Total head movement counts every cylinder travelled, including boundary runs and wrap jumps. A request at the head position costs 0.</li></ul></details>
<details><summary>Banker’s algorithm</summary><ul><li>Need = Maximum − Allocation. Work = Available. Repeatedly pick the lowest-numbered unfinished process with Need ≤ Work, add its Allocation to Work and mark it finished.</li><li>All finished: safe state with a safe sequence. Otherwise unsafe: no order guarantees completion. That is not the same as a deadlock having occurred.</li></ul></details>
<details><summary>Glossary, limits and scope</summary><p><b>Burst time</b>: CPU time needed. <b>Quantum</b>: Round Robin time slice. <b>Frame</b>: memory slot holding one page. <b>Page fault</b>: referenced page is not in a frame. <b>Seek distance</b>: cylinders the head travels. <b>Need</b>: resources a process may still request.</p><p>Limits: 100 processes (times up to 1000); 200 page references and 1–20 frames; 100 disk requests; Banker’s 20 processes × 10 resource types. Everything here simulates textbook algorithms and never touches your real system.</p></details></section>`;
$('#app').innerHTML=hm+
sec('cpu','CPU scheduling','Imagine ONE cashier (the CPU) and several customers (processes). The scheduling algorithm is the rule for who is served next. Pick an algorithm, press Run, then step through it. Times are simulated units.',`<div class=g2><div><label for=cpu-p>Processes (one per line: id, arrival, burst[, priority])</label><textarea id=cpu-p spellcheck=false></textarea><small>Lower priority number = higher priority. Limits: 100 processes; arrival 0–1000; burst 1–1000.</small></div><div><label for=cpu-a>Algorithm</label><select id=cpu-a data-a=alg><option value=FCFS>FCFS<option value=SJF>SJF (non-preemptive)<option value=SRTF>SRTF (preemptive SJF)<option value=RR>Round Robin<option value=PrioNP>Priority (non-preemptive)<option value=PrioP>Priority (preemptive)</select><p class=hint id=cpu-hint></p><div id=cpu-qw><label for=cpu-q>Time quantum (Round Robin)</label><input id=cpu-q inputmode=numeric></div></div></div>`)+
sec('pg','Page replacement','Memory (RAM) has only a few seats (frames). When a program needs a page that has no seat, someone must leave, and the algorithm decides who. Watch each hit, fault and eviction.',`<div class=g2><div><label for=pg-r>Page reference string (spaces or commas)</label><textarea id=pg-r spellcheck=false></textarea><small>Limit: 200 references, page numbers 0–999999.</small></div><div><label for=pg-f>Number of frames (1–20)</label><input id=pg-f inputmode=numeric><label for=pg-a>Algorithm</label><select id=pg-a data-a=alg><option value=FIFO>FIFO<option value=LRU>LRU<option value=OPT>Optimal</select><p class=hint id=pg-hint></p></div></div>`)+
sec('dk','Disk scheduling','The disk head is like an elevator and each request is a floor where someone waits. The algorithm chooses the order of floors; less travel is faster. Every cylinder travelled counts, including boundary runs and wrap jumps.',`<div class=g2><div><label for=dk-r>Request queue (cylinders, spaces or commas)</label><textarea id=dk-r spellcheck=false></textarea><small>Limit: 100 requests.</small></div><div><label for=dk-a>Algorithm</label><select id=dk-a data-a=alg><option value=FCFS>FCFS<option value=SSTF>SSTF<option value=SCAN>SCAN<option value=CSCAN>C-SCAN<option value=LOOK>LOOK<option value=CLOOK>C-LOOK</select><p class=hint id=dk-hint></p><label for=dk-d>Initial direction (needed for SCAN, C-SCAN, LOOK, C-LOOK)</label><select id=dk-d><option value="">Select…<option>Left<option>Right</select></div><div><label for=dk-min>Minimum cylinder</label><input id=dk-min inputmode=numeric><label for=dk-max>Maximum cylinder</label><input id=dk-max inputmode=numeric><label for=dk-h>Initial head position</label><input id=dk-h inputmode=numeric></div></div>`)+
sec('bk','Banker’s algorithm (safety check)','A banker lends limited money (resources) to customers (processes) who have credit limits. Before lending, he checks that everyone could still finish. One row per process, one column per resource type (limit 20 × 10).',`<div class=g2><div><label for=bk-a>Allocation matrix</label><textarea id=bk-a spellcheck=false></textarea></div><div><label for=bk-x>Maximum matrix</label><textarea id=bk-x spellcheck=false></textarea></div><div><label for=bk-v>Available vector</label><input id=bk-v></div></div>`,0)+ln;
mods.cpu.ex();mods.pg.ex();mods.dk.ex();mods.bk.ex();mods.cpu.alg();mods.dk.alg();['cpu','pg','dk'].forEach(hint);['cpu','pg','dk','bk'].forEach(draw);
</script>
</body>
